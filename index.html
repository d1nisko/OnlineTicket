<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnlineTicket — система замовлення квитків</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="header">
        <h1>🎫 OnlineTicket</h1>
        <p class="subtitle">Система онлайн-замовлення квитків на транспорт</p>
    </header>

    <main class="container">
        <div class="status-card">
            <h2>✅ Skeleton initialized successfully</h2>
            <p id="init-message"></p>
        </div>

        <section class="info">
            <h3>Архітектура проєкту</h3>
            <ul>
                <li><strong>assets/</strong> — статичні ресурси (CSS, зображення)</li>
                <li><strong>js/</strong> — клієнтська логіка</li>
                <li><strong>views/</strong> — HTML-сторінки</li>
                <li><strong>index.html</strong> — точка входу</li>
            </ul>
        </section>
    </main>

    <footer class="footer">
        <p>© OnlineTicket. Навчальний проєкт.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
